services:
  # Backend FastAPI Web Service
  - type: web
    name: e-waste-setu-api
    env: python
    region: singapore # or oregon / frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      # Optional: set DATABASE_URL if connecting to managed Postgres
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: e-waste-setu-db
      #     property: connectionString

  # Frontend Vite Static Site
  - type: web
    name: e-waste-setu-web
    env: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: e-waste-setu-api
          property: host
